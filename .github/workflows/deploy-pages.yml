name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject API config (secret, hors du code source)
        env:
          RAAGA_API_URL: ${{ secrets.RAAGA_API_URL }}
        run: |
          if [ -z "$RAAGA_API_URL" ]; then
            echo "::error::Secret RAAGA_API_URL manquant. Ajoutez-le dans Settings → Secrets → Actions."
            exit 1
          fi
          cat > js/play-tester-config.js << EOF
          window.PLAY_TESTER_CONFIG = {
            API_URL: "${RAAGA_API_URL}",
            SIGNUP_PATH: "/api/public/play-tester-signup/",
          };
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
